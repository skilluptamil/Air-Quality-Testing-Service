<!DOCTYPE html>
<html lang="en" data-bs-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - AeroPure Account Security</title>
  <meta name="description" content="Set a new secure password for your AeroPure environmental testing and remediation dashboard.">
  
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <style>
    .auth-page-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, rgba(15, 118, 110, 0.05) 0%, rgba(15, 23, 42, 0.08) 100%), var(--bg-body);
    }
    .auth-header {
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-surface);
    }
    .auth-card {
      max-width: 460px;
      width: 100%;
      margin: auto;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-xl);
      padding: 2.5rem;
    }
  </style>
</head>
<body class="auth-page-wrapper">

  <header class="auth-header">
    <a href="index.html" class="d-flex align-items-center">
      <img src="assets/images/logo.svg" alt="AeroPure" class="site-logo-img" style="height:38px;">
    </a>
    <div class="d-flex align-items-center gap-2">
      <button class="nav-control-btn rtl-toggle-btn" aria-label="Toggle RTL/LTR" title="Switch RTL/LTR"><span class="rtl-badge-text nav-rtl-badge">RTL</span></button>
      <button class="nav-control-btn theme-toggle-btn" aria-label="Toggle Theme" title="Switch Theme"><i class="bi bi-moon-stars-fill theme-toggle-icon"></i></button>
      <a href="login.html" class="btn btn-sm btn-outline-primary ms-1">
        <i class="bi bi-arrow-left me-1"></i> Back to Login
      </a>
    </div>
  </header>

  <main class="container py-5 my-auto">
    <div class="auth-card">
      <div class="text-center mb-4">
        <div class="card-icon-box mx-auto bg-success-subtle text-success mb-3">
          <i class="bi bi-shield-lock"></i>
        </div>
        <h3 class="fw-bold text-primary mb-1">Set New Password</h3>
        <p class="text-muted small">Please create a strong new password that you have not used before.</p>
      </div>

      <form id="resetForm">
        <div class="mb-3">
          <label class="form-label" for="resetPass1">New Password</label>
          <div class="password-toggle-wrap">
            <input type="password" class="form-control" id="resetPass1" placeholder="Minimum 8 characters" required>
            <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility"><i class="bi bi-eye"></i></button>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label" for="resetPass2">Confirm New Password</label>
          <div class="password-toggle-wrap">
            <input type="password" class="form-control" id="resetPass2" placeholder="Re-enter password" required>
            <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility"><i class="bi bi-eye"></i></button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm mb-3">
          <i class="bi bi-check-circle me-1"></i> Update Password &amp; Login
        </button>
      </form>

      <div class="text-center mt-3">
        <a href="login.html" class="small text-muted">&larr; Return to Sign In</a>
      </div>
    </div>
  </main>

  <footer class="text-center py-3 border-top small text-muted">
    &copy; 2026 AeroPure Environmental Solutions. Demo Authentication Flow.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
